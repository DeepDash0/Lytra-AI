project: Lytra
model_name: Lytra V1
training_mode: scratch
language_focus:
  - English
  - code

model:
  family: decoder_only_transformer
  parameters: 2512537600
  num_layers: 36
  hidden_size: 2048
  num_attention_heads: 16
  num_key_value_heads: 2
  head_dim: 128
  intermediate_size: 9216
  activation: swiglu
  norm: rmsnorm
  rms_norm_eps: 1.0e-6
  positional_encoding: rope
  rope_theta: 1000000
  attention_bias: false
  mlp_bias: false
  attention_dropout: 0.0
  tie_word_embeddings: true

tokenizer:
  vocab_size: 65536
  algorithm: byte_level_bpe

context:
  initial_pretrain_sequence_length: 4096
  planned_extension_stages:
    - 8192
    - 16384
    - 32768
    - 65536
    - 131072
