name: Lytra validation tools

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "requirements-audit.txt"
      - "configs/**"
      - ".github/workflows/lytra-validation.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "configs/**"
      - "requirements-audit.txt"
      - ".github/workflows/lytra-validation.yml"

permissions:
  contents: read

jobs:
  synthetic-validation:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local audit runtime
        run: python -m pip install -r requirements-audit.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - name: Canonical packing smoke (synthetic)
        run: python -m scripts.smoke_packing
      - name: Tokenizer alignment CLI smoke (synthetic)
        run: python -m scripts.smoke_alignment
      - name: Proposed 200B budget calculation
        run: |
          python -m scripts.training_budget --config configs/pretraining_200b_proposal.json --output budget-ci.json
          python -c "import json; r=json.load(open('budget-ci.json')); assert r['status']=='PROPOSAL_ONLY' and r['target_accepted_content_tokens']==200000000000 and r['production_ready'] is False"
      - name: Checkpoint replay smoke (synthetic)
        run: python -m scripts.smoke_resume
      - name: Preflight must block missing real-data evidence
        run: |
          python -m scripts.preflight --output preflight-ci.json && exit 1 || status=$?
          test "$status" -eq 2
          python -c "import json; d=json.load(open('preflight-ci.json')); assert d['status']=='BLOCKED' and d['production_ready'] is False"
